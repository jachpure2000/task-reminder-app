<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <style>
    .cards-container {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 18px;
        margin-bottom: 25px;
    }
    .card {
        padding: 18px;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 0 10px rgba(0,0,0,0.08);
        text-align: center;
    }
    .card h3 { margin-bottom: 10px; }
    .recent-table { width: 100%; margin-top: 18px; border-collapse: collapse; }
    .recent-table th, .recent-table td { border: 1px solid #ddd; padding: 10px; }
    .recent-table th { background: #eee; }
  </style>
</head>
<body>

<div th:replace="fragments/header :: header"></div>

<div class="container">

  <h2>Dashboard Overview</h2>

  <div class="cards-container">

    <div class="card">
      <h3>Total Tasks</h3>
      <div th:text="${total}" style="font-size:28px; font-weight:bold;"></div>
    </div>

    <div class="card">
      <h3>Completed</h3>
      <div th:text="${completed}" style="font-size:28px; font-weight:bold; color:green;"></div>
    </div>

    <div class="card">
      <h3>Pending</h3>
      <div th:text="${pending}" style="font-size:28px; font-weight:bold; color:#ff9800;"></div>
    </div>

    <div class="card">
      <h3>Overdue</h3>
      <div th:text="${overdue}" style="font-size:28px; font-weight:bold; color:red;"></div>
    </div>

  </div>

  <div class="cards-container">

    <div class="card">
      <h3>Due Today</h3>
      <div th:text="${dueToday}" style="font-size:26px; font-weight:bold;"></div>
    </div>

    <div class="card">
      <h3>High Priority</h3>
      <div th:text="${highPriority}" style="font-size:26px; font-weight:bold;"></div>
    </div>

    <div class="card">
      <h3><a href="/api/tasks" class="btn">View All Tasks</a></h3>
    </div>

    <div class="card">
      <h3><a href="/api/tasks/add" class="btn btn-primary">Add Task</a></h3>
    </div>

  </div>

  <h3>Recent Tasks</h3>

  <table class="recent-table">
    <thead>
    <tr>
      <th>Title</th>
      <th>Status</th>
      <th>Created</th>
      <th>Due Date</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="task : ${recentTasks}">
      <td th:text="${task.title}"></td>
      <td th:text="${task.status}"></td>
      <td th:text="${task.createdAt}"></td>
      <td th:text="${task.dueDate}"></td>
    </tr>
    <tr th:if="${#lists.isEmpty(recentTasks)}">
      <td colspan="4" style="text-align:center;">No recent tasks</td>
    </tr>
    </tbody>
  </table>

</div>

<footer class="footer">
  <div>Task Reminder App © 2026 — Created by Students</div>
</footer>

</body>
</html>
